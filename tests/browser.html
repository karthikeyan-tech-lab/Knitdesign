<!doctype html><meta charset="utf-8"><title>Jersey browser checks</title>
<style>body{font:15px system-ui;background:#f2f3ee;color:#193c35;margin:24px}li{margin:9px 0}iframe{border:1px solid #abc;background:white;display:block;margin-top:20px}pre{white-space:pre-wrap}.pass{color:#176540}.fail{color:#a22}</style>
<h1>Jersey browser checks</h1><p id="status">Running…</p><ol id="results"></ol><iframe title="390px mobile layout" width="390" height="844"></iframe>
<script>
(async()=>{
 const frame=document.querySelector('iframe'),results=document.querySelector('#results'),status=document.querySelector('#status');
 const original=localStorage.getItem('knit-custom-v3');let checks=0;
 const check=(ok,label)=>{const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS: ':'FAIL: ')+label;results.append(li);if(!ok)throw Error(label);checks++};
 const wait=async(fn,label)=>{const end=performance.now()+12000;while(performance.now()<end){if(fn())return;await new Promise(r=>setTimeout(r,40))}throw Error('Timed out: '+label)};
 let doc,win;const el=id=>doc.getElementById(id);
 const input=(id,value)=>{el(id).value=value;el(id).dispatchEvent(new win.Event('input',{bubbles:true}))};
 const change=(id,value)=>{el(id).value=value;el(id).dispatchEvent(new win.Event('change',{bubbles:true}))};
 const ready=async()=>{await new Promise(r=>win.requestAnimationFrame(()=>win.requestAnimationFrame(r)));await wait(()=>el('previewStatus').textContent.includes('up to date'),'render completion')};
 const click=id=>el(id).click();
 const paint=(r,n)=>{const b=doc.querySelector(`[data-r="${r}"][data-n="${n}"]`);b.dispatchEvent(new win.PointerEvent('pointerdown',{bubbles:true,button:0}));doc.dispatchEvent(new win.PointerEvent('pointerup',{bubbles:true}))};
 try{
  // Keep this test origin's pre-existing design intact on completion.
  localStorage.removeItem('knit-custom-v3');
  frame.src='../index.html';await new Promise(r=>frame.onload=r);doc=frame.contentDocument;win=frame.contentWindow;await ready();
  check(el('jerseyStudy').checked&&el('space').disabled,'fresh browser opens measured jersey study');
  check(doc.documentElement.scrollWidth<=win.innerWidth,'390px layout has no horizontal page overflow');
  check(el('view').getContext('2d').getImageData(400,300,1,1).data[3]===255,'fabric canvas renders');
  const meanTorso=()=>{const d=el('garmentView').getContext('2d').getImageData(450,280,180,260).data,s=[0,0,0];for(let i=0;i<d.length;i+=4)for(let c=0;c<3;c++)s[c]+=d[i+c];return s.map(v=>v/(d.length/4))};
  input('colours','two');
  for(const study of [false,true]){
   el('jerseyStudy').checked=study;el('jerseyStudy').dispatchEvent(new win.Event('input',{bubbles:true}));
   const setFeeders=colours=>doc.querySelectorAll('#feederColors input').forEach((field,i)=>{field.value=colours[i];field.dispatchEvent(new win.Event('input',{bubbles:true}))});
   setFeeders(['#87ceeb','#ffffff']);await ready();const first=meanTorso();
   setFeeders(['#ffffff','#87ceeb']);await ready();const second=meanTorso();
   check(Math.max(...first.map((v,i)=>Math.abs(v-second[i])))<1,'swapped sky-blue/white colour balance: '+(study?'jersey study':'standard renderer'));
  }
  const frontBoth=el('view').toDataURL();input('side','back');await ready();check(el('view').toDataURL()!==frontBoth,'front/back selection updates the image');
  input('side','both');input('zoom','1.5');await ready();check(el('view').toDataURL()!==frontBoth,'zoom updates the image');click('fit');await ready();
  doc.querySelector('[data-brush="T"]').click();paint(0,0);await ready();check(doc.querySelector('[data-r="0"][data-n="0"]').textContent.includes('T')&&el('jerseyMessage').textContent.includes('paused')&&!el('space').disabled,'tuck painting pauses jersey study without losing design');
  click('undo');await ready();check(doc.querySelector('[data-r="0"][data-n="0"]').textContent.includes('K')&&el('space').disabled,'Undo restores jersey and fixed density');
  doc.querySelector('[data-brush="M"]').click();paint(0,0);await ready();check(el('trackMap').textContent.includes('1, 2'),'miss painting updates cam grouping');
  await wait(()=>el('saveStatus').textContent.includes('Saved'),'autosave');
  frame.contentWindow.location.reload();await new Promise(r=>frame.onload=r);doc=frame.contentDocument;win=frame.contentWindow;await ready();check(doc.querySelector('[data-r="0"][data-n="0"]').textContent.includes('M')&&el('jerseyStudy').checked,'autosave restores design and study preference after reload');
  // Observe the normal Save/Export UI downloads without writing files on this test device.
  let captured;win.HTMLAnchorElement.prototype.click=function(){captured={url:this.href,name:this.download}};
  click('save');const saved=await (await fetch(captured.url)).json();check(captured.name==='custom-knit-design.json'&&saved.pattern[0][0]==='M'&&saved.jerseyStudy===true,'Save JSON contains stitches and jersey setting');
  click('new');await ready();const transfer=new win.DataTransfer();transfer.items.add(new win.File([JSON.stringify(saved)],'roundtrip.json',{type:'application/json'}));el('load').files=transfer.files;el('load').dispatchEvent(new win.Event('change',{bubbles:true}));await wait(()=>el('editorMessage').textContent==='Design loaded.','JSON import');await ready();check(doc.querySelector('[data-r="0"][data-n="0"]').textContent.includes('M'),'JSON load restores exported stitches');
  captured=null;click('export');await wait(()=>captured,'PNG export');check(captured.name==='knit-preview.png'&&captured.url.startsWith('data:image/png'),'PNG export uses rendered fabric');
  change('preset','jersey');await ready();const oldGarment=el('garmentView').toDataURL();input('garmentSide','back');await ready();check(el('garmentView').toDataURL()!==oldGarment,'garment back view updates');
  for(const mode of ['fabric','loops','swatch']){click(mode);await ready()}check(true,'all three view modes render');
  change('rows','32');el('needles').value='24';click('applySize');await ready();check(doc.querySelectorAll('#grid button').length===768,'maximum 32×24 design renders');check(doc.documentElement.scrollWidth<=win.innerWidth,'maximum repeat still fits 390px layout');
  frame.width='1280';await new Promise(r=>setTimeout(r,150));check(doc.documentElement.scrollWidth<=win.innerWidth,'1280px desktop layout has no horizontal overflow');
  // Exercise the documented synchronous fallback using the same source.
  const html=await (await fetch('../index.html')).text();frame.srcdoc=html.replace('<title>', '<base href="'+new URL('../',location.href)+'"><script>window.OffscreenCanvas=undefined;<\/script><title>');
  await new Promise(r=>frame.onload=r);doc=frame.contentDocument;win=frame.contentWindow;await ready();check(el('previewStatus').textContent.includes('compatibility'),'main-thread fallback completes');
  check(el('view').getContext('2d').getImageData(400,300,1,1).data[3]===255,'fallback canvas renders');
  status.textContent=`${checks} browser checks passed. HTTPS installation/offline behavior is outside this HTTP preview test.`;
 }catch(e){status.textContent='FAILED: '+e.message;status.className='fail';console.error(e)}
 finally{frame.remove();if(original===null)localStorage.removeItem('knit-custom-v3');else localStorage.setItem('knit-custom-v3',original)}
})();
</script>
